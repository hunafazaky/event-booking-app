basePath: /api
definitions:
  dto.BookingResponse:
    properties:
      booking_code:
        type: string
      event:
        $ref: '#/definitions/dto.EventResponse'
      id:
        type: integer
      phone:
        type: string
    type: object
  dto.BookingSummaryResponse:
    properties:
      booking_code:
        type: string
      id:
        type: integer
      phone:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.EventDetailResponse:
    properties:
      bookings:
        items:
          $ref: '#/definitions/dto.BookingSummaryResponse'
        type: array
      created_at:
        type: string
      datetime:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      name:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.EventListMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_page:
        type: integer
      total_rows:
        type: integer
    type: object
  dto.EventResponse:
    properties:
      created_at:
        type: string
      datetime:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      name:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.SignInResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  service.CreateBookingInput:
    properties:
      event_id:
        type: integer
      phone:
        type: string
    type: object
  service.SignInInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  service.SignUpInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for browsing events and managing bookings.
  title: Event Booking API
  version: "1.0"
paths:
  /auth/me:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get Current User Data
      tags:
      - Auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT with the user's profile.
      parameters:
      - description: Sign in payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.SignInInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.SignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Sign In
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: Sign up payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.SignUpInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Sign Up
      tags:
      - Auth
  /bookings:
    get:
      description: Returns all bookings belonging to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.BookingResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get Current User Bookings
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Creates a booking for an event for the authenticated user.
      parameters:
      - description: Booking payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.CreateBookingInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create New Booking
      tags:
      - Bookings
  /bookings/{id}:
    delete:
      description: Deletes a booking owned by the authenticated user.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete a Booking
      tags:
      - Bookings
  /events:
    get:
      description: Returns a paginated list of events, optionally filtered by search
        term.
      parameters:
      - description: Search by name or description
        in: query
        name: search
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Results per page (default 6)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EventResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.EventListMeta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get All Events
      tags:
      - Events
    post:
      consumes:
      - multipart/form-data
      description: Creates a new event for the authenticated user.
      parameters:
      - description: Event name
        in: formData
        name: name
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        required: true
        type: string
      - description: Event location
        in: formData
        name: location
        required: true
        type: string
      - description: RFC3339 datetime
        in: formData
        name: datetime
        required: true
        type: string
      - description: Event image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create New Event
      tags:
      - Events
  /events/{id}:
    delete:
      description: Deletes an event owned by the authenticated user.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete an Event
      tags:
      - Events
    get:
      description: Returns an event by ID, including its bookings.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get an Event by ID
      tags:
      - Events
    put:
      consumes:
      - multipart/form-data
      description: Updates an event owned by the authenticated user.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Event name
        in: formData
        name: name
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event location
        in: formData
        name: location
        type: string
      - description: RFC3339 datetime
        in: formData
        name: datetime
        type: string
      - description: Event image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update an Event
      tags:
      - Events
  /events/mine:
    get:
      description: Returns events created by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EventResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get Current User Events
      tags:
      - Events
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
